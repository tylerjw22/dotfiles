# Neofetch config — cleaned up
# Original theme by https://github.com/TanbinIslam43

# === DISPLAY INFO ===
print_info() {
    info title
    info underline
    info "Distro" distro
    info "Host" model
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Resolution" resolution
    info "DE" de
    info "Icons" icons
    info "Terminal" term
    info "Terminal Font" term_font
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info cols
}

# === COLORS ===
# Order: title, @, underline, subtitle, colon, info
# 51=electric cyan, 44=vivid teal, 30=dark cyan, 6=standard cyan
colors=(44 37 30 37 30 44)
ascii_colors=(44 7 7 7 44 44)

# === TEXT OPTIONS ===
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"

# === KERNEL ===
kernel_shorthand="on"

# === DISTRO ===
distro_shorthand="off"
os_arch="on"

# === UPTIME ===
uptime_shorthand="on"

# === MEMORY ===
memory_percent="on"
memory_unit="mib"

# ===  PACKAGES ===
package_managers="on"

# ===  SHELL ===
shell_path="off"
shell_version="on"

# ===  CPU ===
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"

# ===  GPU ===
gpu_brand="on"
gpu_type="all"

# ===  RESOLUTION ===
refresh_rate="off"

# ===  GTK ===
gtk_shorthand="off"
gtk2="on"
gtk3="on"

# ===  DE ===
de_version="on"

# ===  DISK ===
disk_show=('/')
disk_subtitle="mount"
disk_percent="on"

# ===  COLOR BLOCKS ===
block_range=(0 7)
color_blocks="off"
block_width=3
block_height=1
col_offset="auto"

# ===  PROGRESS BARS ===
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"

# ===  INFO DISPLAY ===
cpu_display="off"
memory_display="info"
battery_display="off"
disk_display="off"

# ===  ASCII ===
image_backend="ascii"
image_source="auto"
ascii_distro="arch_old"
ascii_bold="on"

# ===  IMAGE ===
image_loop="off"
thumbnail_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/thumbnails/neofetch"
crop_mode="normal"
crop_offset="center"
image_size="auto"
gap=3
yoffset=0
xoffset=0

# ===  MISC ===
stdout="off"
